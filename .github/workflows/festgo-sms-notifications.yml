name: FestGo SMS notifications

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: festgo-sms-notifications
  cancel-in-progress: false

jobs:
  notifications:
    if: vars.FESTGO_SMS_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FESTGO_NOTIFICATIONS_URL: ${{ vars.FESTGO_NOTIFICATIONS_URL }}
      FESTGO_CRON_SECRET: ${{ secrets.FESTGO_CRON_SECRET }}
    steps:
      - name: Process the existing notification queue
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FESTGO_NOTIFICATIONS_URL"
          test -n "$FESTGO_CRON_SECRET"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $FESTGO_CRON_SECRET" \
            "$FESTGO_NOTIFICATIONS_URL"
